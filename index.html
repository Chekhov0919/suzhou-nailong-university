<style>
  :root{
    --bg:#000;
    --text:#f5f5f7;
    --text-2:#86868b;
    --text-3:#6e6e73;
    --blue:#2997ff;
    --btn:#0071e3;
    --btn-hover:#0077ed;
    --glass:rgba(255,255,255,.07);
    --glass-line:rgba(255,255,255,.13);
    --ease:cubic-bezier(.16,1,.3,1);
    --font:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC","SimSun","Times New Roman",serif;

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100svh;
    font-family:var(--font);
    background:var(--bg);color:var(--text);

  /* ---------- 全屏背景：入场缓慢拉近，之后极慢呼吸 ---------- */

  .bg__img{
    position:absolute;inset:0;
    background:url("assets/nailong.png") center 46%/cover no-repeat;
    transform:scale(1.02);
    animation:heroIn 2.2s var(--ease) both, drift 34s ease-in-out 2.2s infinite alternate;
  }
  @keyframes heroIn{from{transform:scale(1.16)}to{transform:scale(1.02)}}
  @keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.07)}}
  /* 电影感上下压暗 + 中心轻微提亮，纯 CSS，不动原图 */
  .bg__scrim{
    position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(115% 78% at 50% 44%, rgba(0,0,0,.10) 0%, rgba(0,0,0,.52) 62%, rgba(0,0,0,.82) 100%),
      linear-gradient(180deg, rgba(0,0,0,.82) 0%, rgba(0,0,0,.20) 26%, rgba(0,0,0,.30) 60%, rgba(0,0,0,.92) 100%);
  }

  /* ---------- 顶部导航：毛玻璃，48px ---------- */
  .nav{
    position:sticky;top:0;z-index:10;
    height:48px;flex:0 0 auto;
    font-family:var(--font-sans);
    display:flex;align-items:center;gap:.55rem;
    padding:0 clamp(1rem,3.4vw,2.6rem);
    font-size:12px;letter-spacing:.01em;
    background:rgba(0,0,0,.55);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .nav__mark{
    width:18px;height:18px;border-radius:5px;flex:0 0 auto;
    object-fit:cover;display:block;
    box-shadow:0 0 0 .5px rgba(255,255,255,.28);
  }
  .nav__brand{font-weight:600;color:var(--text)}
  .nav__sep{color:var(--text-3)}
  .nav__meta{color:var(--text-2)}
  .nav__right{margin-left:auto;color:var(--text-2)}

  /* ---------- 主体：一屏，居中 ---------- */
  main{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:clamp(2rem,6vh,4.5rem) clamp(1.2rem,5vw,2rem);
    gap:clamp(1.2rem,3.4vh,2rem);
  }

  .icon{
    width:clamp(64px,9vw,84px);aspect-ratio:1;border-radius:22.5%;
    overflow:hidden;background:#fff;
    box-shadow:0 0 0 .5px rgba(255,255,255,.30), 0 20px 44px -16px rgba(0,0,0,.9), 0 2px 8px rgba(0,0,0,.35);
  }
  .icon img{display:block;width:100%;height:100%;object-fit:cover}

  .title-wrap{display:flex;flex-direction:column;align-items:center;gap:clamp(.5rem,1.6vh,.85rem)}
  h1{
    margin:0;
    font-size:clamp(2.5rem,9.4vw,5.4rem);
    line-height:1.04;font-weight:600;letter-spacing:.005em;
    background:linear-gradient(180deg,#fff 30%,#d8d8dd 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .subtitle{
    margin:0;color:var(--text-2);
    font-size:clamp(1rem,2.6vw,1.4rem);font-weight:400;letter-spacing:.02em;
  }

  /* ---------- 玻璃卡片 ---------- */
  .panel{
    width:min(620px,100%);
    font-family:var(--font-sans);
    padding:clamp(1.25rem,3.2vw,1.75rem);
    border-radius:20px;border:1px solid var(--glass-line);
    background:var(--glass);
    -webkit-backdrop-filter:saturate(180%) blur(24px);
    backdrop-filter:saturate(180%) blur(24px);
    box-shadow:0 30px 70px -34px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.10);
    display:flex;flex-direction:column;gap:1.15rem;
    text-align:left;
  }
  .count{display:flex;align-items:baseline;gap:.7rem}
  .count__num{
    font-size:clamp(2.4rem,7vw,3.2rem);font-weight:600;line-height:1;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
  }
  .count__num small{font-size:.34em;font-weight:400;color:var(--text-2);margin-left:.22em;letter-spacing:.04em}
  .count__label{color:var(--text-2);font-size:clamp(.85rem,2.2vw,.95rem);line-height:1.6}
  .count__label b{color:var(--text);font-weight:500}
  .count__label .url{color:var(--text-3);font-size:.92em}

  .track{height:4px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
  .track__bar{
    height:100%;width:100%;border-radius:99px;
    background:linear-gradient(90deg,#0a84ff,#2997ff);
    transform-origin:left center;transform:scaleX(1);
  }
  .paused .track__bar{background:rgba(255,255,255,.35)}
  .paused .count__num{color:var(--text-2)}

  .actions{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
  .btn{
    -webkit-appearance:none;appearance:none;cursor:pointer;text-decoration:none;
    font-family:inherit;font-size:.94rem;font-weight:500;letter-spacing:.01em;
    padding:.72rem 1.35rem;border-radius:980px;border:1px solid transparent;
    transition:background .25s var(--ease), color .25s var(--ease), transform .25s var(--ease), border-color .25s var(--ease);
    display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap;
  }
  .btn--primary{background:var(--btn);color:#fff}
  .btn--primary:hover{background:var(--btn-hover)}
  .btn--ghost{background:rgba(255,255,255,.10);color:var(--text);border-color:var(--glass-line)}
  .btn--ghost:hover{background:rgba(255,255,255,.16)}
  .btn:active{transform:scale(.975)}
  .btn:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

  .hint{margin:0;color:var(--text-3);font-size:.78rem;line-height:1.7;letter-spacing:.01em}
  .hint a{color:var(--blue);text-decoration:none}
  .hint a:hover{text-decoration:underline}

  /* ---------- 底部 ---------- */
  footer{
    flex:0 0 auto;
    padding:1.1rem clamp(1.2rem,5vw,2rem) calc(1.3rem + env(safe-area-inset-bottom));
    border-top:1px solid rgba(255,255,255,.08);
    color:var(--text-3);font-size:.72rem;line-height:1.9;
    display:flex;flex-wrap:wrap;gap:.35rem 1.4rem;justify-content:center;text-align:center;
  }
  footer a{color:var(--text-2);text-decoration:none}
  footer a:hover{color:var(--text);text-decoration:underline}

  /* ---------- 入场：淡入 + 上浮 + 去模糊 ---------- */
  .rise{animation:rise 1.1s var(--ease) both}
  @keyframes rise{
    from{opacity:0;transform:translateY(20px);filter:blur(10px)}
    to{opacity:1;transform:none;filter:blur(0)}
  }
  .d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.d4{animation-delay:.48s}

  @media (max-width:640px){
    .nav__right,.nav__meta,.nav__sep{display:none}
    .panel{text-align:center;align-items:center}
    .count{justify-content:center}
    .actions{justify-content:center;width:100%}
    .btn{flex:1 1 auto;justify-content:center}
  }
  @media (prefers-reduced-motion:reduce){
    .bg__img{animation:none;transform:none}
    .rise{animation-duration:.01s}
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="bg__img"></div></div>
  <div class="bg__scrim" aria-hidden="true"></div>

    <span class="nav__brand">苏州奶龙大学</span>

  <main>
    <div class="icon rise" aria-hidden="true">
      <img src="assets/nailong-icon.png" alt="">
    </div>

    <div class="title-wrap">
      <h1 class="rise d1">苏州奶龙大学</h1>
      <p class="subtitle rise d2">养天地奶龙。法古今完人。</p>
    </div>

    <section class="panel rise d3" id="panel" aria-label="跳转倒计时">

        <div class="count__num" id="num">6<small>秒</small></div>
        <div class="count__label">
          <b id="status">后自动前往苏州大学官网</b><br>

      <p class="hint" id="sr" aria-live="polite">本页面由一只路过的奶龙维护，跳转目标为<a href="https://www.suda.edu.cn/" rel="noopener">苏州大学官网</a>。</p>

  </footer>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "苏州奶龙大学",
    "alternateName": ["苏州奶龙大学官网", "Soochow Nailong University"],
    "description": "苏州奶龙大学趣味跳转页，自动前往苏州大学官方网站 www.suda.edu.cn。",
    "inLanguage": "zh-CN",
    "url": "https://chekhov0919.github.io/suzhou-nailong-university/"
  }
  </script>

  <script>
  (function () {
    var TARGET = "https://www.suda.edu.cn/";
    var TOTAL  = 6;                        // 倒计时秒数

    var numEl    = document.getElementById("num");
    var barEl    = document.getElementById("bar");
    var statusEl = document.getElementById("status");
    var toggle   = document.getElementById("toggle");
    var panel    = document.getElementById("panel");
    var sr       = document.getElementById("sr");

    var remaining = TOTAL, paused = false, done = false, last = null, announced = -1;

    function paint() {
      numEl.innerHTML = Math.max(0, Math.ceil(remaining)) + "<small>秒</small>";
      barEl.style.transform = "scaleX(" + Math.max(0, Math.min(1, remaining / TOTAL)).toFixed(4) + ")";
    }

    function loop(now) {
      if (last === null) last = now;
      var dt = (now - last) / 1000;
      last = now;

      if (!paused && !done && !document.hidden) {
        remaining -= dt;
        if (remaining <= 0) { remaining = 0; paint(); done = true; location.href = TARGET; return; }
        paint();
        var s = Math.ceil(remaining);
        if (s !== announced) { announced = s; sr.textContent = s + " 秒后跳转至苏州大学官网"; }
      }
      requestAnimationFrame(loop);
    }

    // 切到别的标签页时暂停，回来继续，避免人不在却被跳走
    document.addEventListener("visibilitychange", function () { last = null; });

    toggle.addEventListener("click", function () {
      paused = !paused;
      panel.classList.toggle("paused", paused);
      if (paused) {
        statusEl.textContent = "自动跳转已暂停";
        toggle.textContent = "继续自动跳转";
        sr.textContent = "已暂停，可点击按钮手动前往苏州大学官网。";
      } else {
        if (remaining < 3) remaining = 3;
        statusEl.textContent = "后自动前往苏州大学官网";
        toggle.textContent = "取消自动跳转";
      }
    });

    paint();
    requestAnimationFrame(loop);
  })();
  </script>
