<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>页面不存在 · 苏州奶龙大学</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/suzhou-nailong-university/assets/favicon.png" type="image/png">
<meta http-equiv="refresh" content="3; url=/suzhou-nailong-university/">
<style>
  :root{--text:#f5f5f7;--text-2:#86868b;--blue:#2997ff;
    --font:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC","SimSun",serif}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100svh;display:grid;place-items:center;text-align:center;
    background:#000;color:var(--text);font-family:var(--font);padding:2rem;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(90% 60% at 50% 0%, rgba(41,151,255,.13), rgba(0,0,0,0) 70%);
  }
  .icon{
    width:64px;height:64px;margin:0 auto 1.6rem;border-radius:22.5%;
    object-fit:cover;display:block;background:#fff;
    box-shadow:0 0 0 .5px rgba(255,255,255,.3), 0 18px 40px -14px rgba(0,0,0,.9);
    filter:grayscale(.4) opacity(.88);
  }
  h1{
    margin:0 0 .6rem;font-size:clamp(1.8rem,6vw,2.6rem);font-weight:600;letter-spacing:.01em;
    background:linear-gradient(180deg,#fff 30%,#d8d8dd 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  p{margin:0;color:var(--text-2);font-size:.95rem;line-height:1.9}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div>
    <img class="icon" src="/suzhou-nailong-university/assets/nailong-icon.png" alt="">
    <h1>这只奶龙迷路了</h1>

  </div>
</body>
</html>
